name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Signature JSON is up to date
        run: |
          cp signatures/signatures.json /tmp/before.json
          php tools/build-signatures.php
          # The version field is the build date; compare everything else.
          diff <(grep -v '"version"' /tmp/before.json) <(grep -v '"version"' signatures/signatures.json)
      - name: Unit tests
        run: php tests/run.php
