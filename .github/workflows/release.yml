name: Release

# Every push to main whose plugin version has no release yet publishes one,
# using the same script maintainers run locally (tools/build-release.sh).
# Customer sites pick the release up through the built-in GitHub updater.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' fckmaleware.php | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test and publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build-release.sh --publish
